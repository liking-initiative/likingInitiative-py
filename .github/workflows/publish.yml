name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing, so no
# token is stored: the PyPI project must list this repository, this workflow
# file name, and the "pypi" environment as a publisher.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
